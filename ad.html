<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="monetag" content="4293fb3eceaaecb28088ce4393bd5b6f">
  <title>Verb - Publicité</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: #0D1B2A;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .ad-label {
      font-size: 10px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .ad-slot {
      width: 100%;
      max-width: 480px;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .ad-slot > div, .ad-slot > ins { max-width: 100%; }
    ins.adsbygoogle { display: block !important; }
    /* AdSense a besoin d'une largeur explicite sinon : No slot size for availableWidth=0 */
    #ad-primary { width: 100%; }
    #ad-fallback { overflow: hidden; }
    #ad-fallback > div { max-width: 100%; }
    #ad-fallback iframe { border: 0; }
    .iframe-fit { position: relative; width: 100%; overflow: hidden; }
    .iframe-fit > iframe { position: absolute; top: 0; left: 0; transform-origin: top left; border: 0; }
    #fallback-status { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 8px; }
  </style>
  <!-- 1) PRIMAIRE : Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5698690251461782" crossorigin="anonymous"></script>
</head>
<body>
  <div class="ad-label">Publicité</div>

  <div class="ad-slot">
    <!-- Conteneur primaire AdSense -->
    <ins id="ad-primary" class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-5698690251461782"
         data-ad-slot="9956769655"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

    <!-- Conteneur des secours (injectés uniquement si AdSense ne s'affiche pas) -->
    <div id="ad-fallback" style="width:100%; display:none;"></div>
    <div id="fallback-status"></div>
  </div>

  <script>
    // ============================================================
    // CHAÎNE DE RESSOURCE :
    // AdSense -> Adsterra (3 tags) -> Monetag (zone) -> Monetag (direct)
    // Un seul réseau affiché à la fois, on avance si rien ne s'affiche.
    // ============================================================

    var ADSTERRA_TAGS = [
      { path: '1',  hash: '8d89bb3de39d17f17e2cb18832f34a48', container: false }, // prioritaire
      { path: '21', hash: '303483616a3ae887c7a19116e56ecccf', container: true  }, // Native / Social Bar
      { path: '14', hash: '00ca0c186251734dde4cd60a985d45fe', container: false }
    ];

    // Bannière Adsterra 728x90 (format atOptions)
    var ADSTERRA_BANNER = {
      key: '9fb9ff5b6726bc946b29b88fa8f2efe9',
      src: 'https://bauval.org/22/9fb9ff5b6726bc946b29b88fa8f2efe9'
    };

    // Lien direct supplémentaire
    var DIRECT_LINK = 'https://araplhn.org/4/7ee0af34737db76af73c0203f83e0433';

    function makeAdsterraEntry(t) {
      return {
        name: 'Adsterra ' + t.path,
        id: t.hash,
        type: 'adsterra',
        container: t.container,
        load: function () {
          var box = document.getElementById('ad-fallback');
          if (this.container) {
            var d = document.createElement('div');
            d.id = 'container-' + this.id;
            d.style.cssText = 'width:100%;min-height:90px;';
            box.appendChild(d);
          }
          var s = document.createElement('script');
          s.async = true;
          s.setAttribute('data-cfasync', 'false');
          s.src = 'https://bauval.org/' + t.path + '/' + t.hash;
          box.appendChild(s);
        }
      };
    }

    var FALLBACKS = [
      // --- 2) ADSTERRA : bannière 728x90 (meilleur format pour notre conteneur) ---
      {
        name: 'Adsterra banner 728x90',
        id: ADSTERRA_BANNER.key,
        type: 'adsterra',
        load: function () {
          var box = document.getElementById('ad-fallback');
          var conf = document.createElement('script');
          conf.text = 'atOptions = { "key": "' + ADSTERRA_BANNER.key + '", "format": "iframe", "height": 90, "width": 728, "params": {} };';
          box.appendChild(conf);
          var inv = document.createElement('script');
          inv.async = true;
          inv.setAttribute('data-cfasync', 'false');
          inv.src = ADSTERRA_BANNER.src;
          box.appendChild(inv);
        }
      }
    ].concat(ADSTERRA_TAGS.map(makeAdsterraEntry)).concat([
      // --- Monetag : zone In-Page Push / bannière ---
      {
        name: 'Monetag zone',
        id: '6153743',
        type: 'monetag',
        load: function () {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://fpyf8.com/88/tag.min.js';
          s.setAttribute('data-zone', this.id);
          document.body.appendChild(s);
        }
      },
      // --- Monetag : lien direct ---
      {
        name: 'Monetag direct',
        id: 'https://uplcm.com/4/12131287',
        type: 'iframe',
        load: function () {
          var f = document.createElement('iframe');
          f.src = this.id;
          f.style.cssText = 'width:100%;min-height:110px;border:0;background:#0D1B2A;';
          f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox');
          document.getElementById('ad-fallback').appendChild(f);
        }
      },
      // --- PropellerAds (à configurer : remplacer REPLACE_...) ---
      {
        name: 'PropellerAds',
        id: 'REPLACE_PROPELLER_ZONE_ID',
        type: 'propeller',
        load: function () {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.highperformanceformat.com/' + this.id + '/invoke.js';
          document.getElementById('ad-fallback').appendChild(s);
        }
      },
      // --- Lien direct supplémentaire (dernier recours) ---
      {
        name: 'Direct link',
        id: DIRECT_LINK,
        type: 'iframe',
        load: function () {
          var f = document.createElement('iframe');
          f.src = this.id;
          f.style.cssText = 'width:100%;min-height:110px;border:0;background:#0D1B2A;';
          f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox');
          document.getElementById('ad-fallback').appendChild(f);
        }
      }
    ]);

    var fallbackIndex = -1;
    var statusEl = document.getElementById('fallback-status');
    var bodySnapshot = 0;
    var chainActive = false;

    // Met une iframe à l'échelle du conteneur (évite l'overflow 728px > 420px)
    function fitIframe(frame) {
      try {
        if (frame.dataset.fitted) return;
        frame.dataset.fitted = '1';
        var natW = parseInt(frame.getAttribute('width'), 10) || frame.offsetWidth || 728;
        var natH = parseInt(frame.getAttribute('height'), 10) || frame.offsetHeight || 90;
        var wrap = document.createElement('div');
        wrap.className = 'iframe-fit';
        frame.parentNode.insertBefore(wrap, frame);
        wrap.appendChild(frame);
        frame.style.width = natW + 'px';
        frame.style.height = natH + 'px';
        var apply = function () {
          var avail = wrap.clientWidth || natW;
          var scale = Math.min(1, avail / natW);
          frame.style.transform = 'scale(' + scale + ')';
          wrap.style.height = Math.round(natH * scale) + 'px';
        };
        apply();
        window.addEventListener('resize', apply);
      } catch (e) {}
    }

    // Une iframe est "réelle" seulement si elle a un contenu (pas about:blank vide)
    function iframeHasContent(fr) {
      try {
        var src = fr.src || '';
        if (src && src !== 'about:blank' && src.indexOf('data:') !== 0) return true;
        var doc = fr.contentDocument;
        if (doc && doc.body && doc.body.children.length > 0) return true;
        if (doc && doc.body && (doc.body.innerHTML || '').trim().length > 50) return true;
      } catch (e) {
        return true; // cross-origin = on suppose qu'il y a du contenu
      }
      return false;
    }

    // AdSense écrit lui-même data-ad-status : "filled" | "unfilled" | absent = en cours
    function adsenseState() {
      var ins = document.getElementById('ad-primary');
      if (!ins) return 'absent';
      var st = (ins.getAttribute('data-ad-status') || '').toLowerCase();
      if (st) return st;
      // filet de sécurité si l'attribut n'est pas présent
      if (ins.offsetHeight > 10 && ins.innerHTML.trim() !== '' &&
          ins.querySelector('iframe:not([src*="about:blank"])')) return 'filled';
      return 'pending';
    }

    function hasVisibleAd() {
      // 1) AdSense : uniquement si Google a réellement rempli la pub
      if (adsenseState() === 'filled') return true;

      // 2) Conteneurs injectés dans #ad-fallback (Adsterra avec container, iframe, etc.)
      var fb = document.getElementById('ad-fallback');
      if (fb) {
        var kids = fb.children;
        for (var i = 0; i < kids.length; i++) {
          var el = kids[i];
          if (el.tagName === 'SCRIPT') continue;
          if (el.tagName === 'IFRAME') {
            if (iframeHasContent(el)) { fitIframe(el); return true; }
            continue;
          }
          if (el.classList.contains('iframe-fit')) {
            var inner = el.querySelector('iframe');
            if (inner && iframeHasContent(inner)) return true;
            continue;
          }
          // conteneur Adsterra rempli
          if (el.children.length > 0 && el.offsetHeight > 20) return true;
          // élément sans enfant mais visible (bannière simple)
          if (el.offsetHeight > 40 && el.offsetWidth > 100) return true;
        }
      }

      // 3) Réseaux injectant directement dans <body> (Adsterra sans container, Monetag…)
      if (chainActive) {
        var body = document.body.children;
        for (var j = bodySnapshot; j < body.length; j++) {
          var b = body[j];
          if (b.tagName === 'SCRIPT' || b.tagName === 'STYLE' || b.tagName === 'LINK') continue;
          if (b.offsetHeight > 30 && b.offsetWidth > 50) return true;
        }
        var mz = document.querySelector('[class*="monetag"], [id*="monetag"], [class*="in-page"], [id^="container-"]');
        if (mz && mz.offsetHeight > 30) return true;
      }
      return false;
    }

    function tryNextFallback() {
      fallbackIndex++;
      if (fallbackIndex >= FALLBACKS.length) {
        statusEl.textContent = 'Publicité indisponible';
        return;
      }
      var fb = FALLBACKS[fallbackIndex];
      if (String(fb.id).indexOf('REPLACE_') === 0) {
        tryNextFallback(); // ID non configuré -> on passe au suivant
        return;
      }
      document.getElementById('ad-primary').style.display = 'none';
      document.getElementById('ad-fallback').style.display = 'block';

      // Snapshot du <body> AVANT injection, pour détecter ce qui arrive après
      chainActive = true;
      bodySnapshot = document.body.children.length;

      try { fb.load(); } catch (e) { tryNextFallback(); return; }

      var delay = (fb.type === 'monetag' || fb.type === 'adsterra') ? 7000 : 5000;
      setTimeout(function () {
        if (!hasVisibleAd()) tryNextFallback();
      }, delay);
    }

    // Vérifie AdSense après 6 secondes
    setTimeout(function () {
      if (!hasVisibleAd()) tryNextFallback();
    }, 6000);
  </script>
</body>
</html>
