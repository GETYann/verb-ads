<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verb - Publicité</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: #0D1B2A;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .ad-label {
      font-size: 10px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .ad-slot {
      width: 100%;
      max-width: 480px;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    ins.adsbygoogle { display: block !important; }
    #fallback-status { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 8px; }
  </style>
  <!-- 1) PRIMAIRE : Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5698690251461782" crossorigin="anonymous"></script>
</head>
<body>
  <div class="ad-label">Publicité</div>

  <div class="ad-slot">
    <!-- Conteneur primaire AdSense -->
    <ins id="ad-primary" class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-5698690251461782"
         data-ad-slot="9956769655"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

    <!-- Conteneurs de secours (injectés uniquement si AdSense ne s'affiche pas) -->
    <div id="ad-fallback" style="width:100%; display:none;"></div>
    <div id="fallback-status"></div>
  </div>

  <script>
    // ============================================================
    // CHAÎNE DE RESSOURCE : AdSense -> PropellerAds -> Adsterra -> Monetag
    // Chaque ID ci-dessous doit être remplacé par TON ID après création du compte.
    // ============================================================

    var FALLBACKS = [
      // --- 2) MONETAG (zone In-Page Push / bannière) ---
      {
        name: 'Monetag zone',
        id: '6153743',
        waitForBody: true,
        load: function () {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://fpyf8.com/88/tag.min.js';
          s.setAttribute('data-zone', this.id);
          document.body.appendChild(s);
        }
      },
      // --- 3) MONETAG (lien direct) ---
      {
        name: 'Monetag direct',
        id: 'https://uplcm.com/4/12131287',  // lien direct Monetag
        load: function () {
          var f = document.createElement('iframe');
          f.src = this.id;
          f.style.cssText = 'width:100%;min-height:100px;border:0;background:#0D1B2A;';
          f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox');
          document.getElementById('ad-fallback').appendChild(f);
        }
      },
      // --- 4) PROPELLERADS (bannière) ---
      {
        name: 'PropellerAds',
        id: 'REPLACE_PROPELLER_ZONE_ID',   // ex: 1234567
        load: function () {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.highperformanceformat.com/' + this.id + '/invoke.js';
          document.getElementById('ad-fallback').appendChild(s);
        }
      },
      // --- 5) ADSTERRA (bannière 320x50 / 728x90 selon le format choisi) ---
      {
        name: 'Adsterra',
        id: 'REPLACE_ADSTERRA_KEY',        // clé atOptions
        load: function () {
          var conf = document.createElement('script');
          conf.type = 'text/javascript';
          conf.text = 'atOptions = { "key": "' + this.id + '", "format": "iframe", "height": 90, "width": 728, "params": {} };';
          document.getElementById('ad-fallback').appendChild(conf);
          var inv = document.createElement('script');
          inv.async = true;
          inv.src = '//' + this.id.toLowerCase() + '/invoke.js';
          document.getElementById('ad-fallback').appendChild(inv);
        }
      }
    ];

    var fallbackIndex = -1;
    var statusEl = document.getElementById('fallback-status');

    function hasVisibleAd() {
      var ins = document.getElementById('ad-primary');
      if (ins && ins.offsetHeight > 10 && ins.innerHTML.trim() !== '') return true;
      var fb = document.getElementById('ad-fallback');
      if (fb && fb.offsetHeight > 10 && fb.children.length > 0) return true;
      // Monetag injecte ses éléments directement dans <body>
      if (monetagLoaded) {
        var mz = document.querySelector('[data-zone-id], .monetag, [id*="monetag"], [class*="monetag"]');
        if (mz && mz.offsetHeight > 10) return true;
        // détecte n'importe quel élément ajouté après chargement du tag
        if (document.body.children.length > bodyChildCount) return true;
      }
      return false;
    }

    function tryNextFallback() {
      fallbackIndex++;
      if (fallbackIndex >= FALLBACKS.length) {
        statusEl.textContent = 'Publicité indisponible';
        return;
      }
      var fb = FALLBACKS[fallbackIndex];
      if (fb.id.indexOf('REPLACE_') === 0) {
        // ID pas encore configuré -> on tente le suivant
        tryNextFallback();
        return;
      }
      document.getElementById('ad-primary').style.display = 'none';
      document.getElementById('ad-fallback').style.display = 'block';
      if (fb.waitForBody) {
        monetagLoaded = true;
        bodyChildCount = document.body.children.length;
      }
      try { fb.load(); } catch (e) { tryNextFallback(); return; }
      // Si ce réseau ne fill pas non plus -> suivant
      var delay = fb.waitForBody ? 6000 : 5000;
      setTimeout(function () {
        if (!hasVisibleAd()) tryNextFallback();
      }, delay);
    }

    var monetagLoaded = false;
    var bodyChildCount = 0;

    // Vérifie AdSense après 6 secondes
    setTimeout(function () {
      if (!hasVisibleAd()) tryNextFallback();
    }, 6000);
  </script>
</body>
</html>
